services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 AdPortal.asgi:application
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - logs:/app/logs
    # Not published to the host: only nginx (internal network) may reach Django.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  celery:
    build: .
    restart: unless-stopped
    command: celery -A AdPortal worker -l info -c 2
    volumes:
      - media:/app/media
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A AdPortal beat -l info --schedule /app/logs/celerybeat-schedule
    volumes:
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      FRONTEND_HOSTS: ${FRONTEND_HOSTS:-localhost useadportal.com www.useadportal.com}
      API_HOSTS: ${API_HOSTS:-api.useadportal.com}
      CERT_NAME: ${CERT_NAME:-useadportal.com}
      # Dozzle (Docker logs) is reachable only from this address/CIDR. Set to your VPN/office IP.
      DOZZLE_ALLOW: ${DOZZLE_ALLOW:-127.0.0.1}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./frontend:/app/frontend:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    profiles:
      - prod
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/certbot-loop.sh"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - ./scripts/certbot-loop.sh:/certbot-loop.sh:ro
    depends_on:
      - nginx

  dozzle:
    image: amir20/dozzle:v8
    container_name: dozzle
    restart: unless-stopped
    profiles:
      - prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/users.yml:/data/users.yml:ro
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_BASE: /dozzle

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
  logs:
  letsencrypt:
  certbot_webroot:
