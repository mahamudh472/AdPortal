services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Set REDIS_PASSWORD in .env to require authentication (recommended).
    command: ["sh", "-c", "exec redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    # HTTP API: Gunicorn (multiple workers/threads). Sync DRF views under Daphne would run on a
    # single shared thread, so Daphne is only used for WebSockets (service "ws").
    command: >
      gunicorn AdPortal.wsgi:application --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3} --threads ${GUNICORN_THREADS:-4}
      --timeout 60 --graceful-timeout 30 --max-requests 2000 --max-requests-jitter 200
      --access-logfile - --access-logformat '%(h)s "%(r)s" %(s)s %(b)s %(L)s'
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - logs:/app/logs
    # Not published to the host: only nginx (internal network) may reach Django.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  ws:
    build: .
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8001 AdPortal.asgi:application
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"

  celery:
    build: .
    restart: unless-stopped
    command: celery -A AdPortal worker -l info -c 2 -Q celery
    volumes:
      - media:/app/media
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-ai:
    build: .
    restart: unless-stopped
    command: celery -A AdPortal worker -l info -c 1 -Q ai -n ai@%h
    volumes:
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A AdPortal beat -l info --schedule /app/logs/celerybeat-schedule
    volumes:
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # SPA built from the separate frontend repo (see FRONTEND_CONTEXT). Not published to the host:
  # only the edge nginx reaches it. VITE_* values are baked into the bundle at build time, so
  # changing them requires `docker compose --profile prod build frontend`.
  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../adportal_frontend}
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.useadportal.com}
        VITE_API_BASE_WS_URL: ${VITE_API_BASE_WS_URL:-wss://api.useadportal.com}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    profiles:
      - prod
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      FRONTEND_HOSTS: ${FRONTEND_HOSTS:-localhost useadportal.com www.useadportal.com}
      API_HOSTS: ${API_HOSTS:-api.useadportal.com}
      CERT_NAME: ${CERT_NAME:-useadportal.com}
      # Dozzle (Docker logs) is reachable only from this address/CIDR. Set to your VPN/office IP.
      DOZZLE_ALLOW: ${DOZZLE_ALLOW:-127.0.0.1}
      # Django admin (/admin/) is reachable only from this address/CIDR.
      ADMIN_ALLOW: ${ADMIN_ALLOW:-127.0.0.1}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - web
      - ws
      - frontend

  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    profiles:
      - prod
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/certbot-loop.sh"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - ./scripts/certbot-loop.sh:/certbot-loop.sh:ro
    depends_on:
      - nginx

  dozzle:
    image: amir20/dozzle:v8
    container_name: dozzle
    restart: unless-stopped
    profiles:
      - prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/users.yml:/data/users.yml:ro
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_BASE: /dozzle

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
  logs:
  letsencrypt:
  certbot_webroot:
